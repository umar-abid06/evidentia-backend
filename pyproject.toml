[project]
name = "evidentia"
version = "0.1.0"
description = "Agentic document intelligence and grounded answer platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pyjwt>=2.15",
    "pwdlib[argon2]>=0.3",
    "email-validator>=2.3",
    "openai>=3.37",
    "tiktoken>=0.14",
    "celery[redis]>=5.6",
    "redis>=8.1",
    "pypdf>=6.21",
    "boto3>=1.43",
    "pgvector>=0.5",
    "rapidfuzz>=3.14",
    "httpx>=0.28",
    "airportsdata>=20260905",
    "cryptography>=50.0",
    "prometheus-client>=0.26",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "mcp>=2.3",
]

[project.scripts]
evidentia = "evidentia.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "celery-types>=0.26",
    "pre-commit>=4.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PL", "PT", "TID"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004", "PLC0415"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL with pgvector (TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["evidentia"]
branch = true

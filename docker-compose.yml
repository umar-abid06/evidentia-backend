name: evidentia

x-app: &app
  build: .
  image: evidentia-backend:local
  env_file:
    - path: .env
      required: false
  environment:
    EVIDENTIA_DATABASE__URL: postgresql+asyncpg://evidentia:evidentia@db:5432/evidentia
    EVIDENTIA_REDIS__URL: redis://redis:6379/0
    EVIDENTIA_STORAGE__ENDPOINT_URL: http://minio:9000
    EVIDENTIA_STORAGE__PUBLIC_ENDPOINT_URL: http://localhost:9000
    EVIDENTIA_STORAGE__ACCESS_KEY_ID: evidentia
    EVIDENTIA_STORAGE__SECRET_ACCESS_KEY: evidentia-local-secret
    EVIDENTIA_STORAGE__BUCKET: evidentia-documents
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: evidentia
      POSTGRES_PASSWORD: evidentia
      POSTGRES_DB: evidentia
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidentia -d evidentia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evidentia
      MINIO_ROOT_PASSWORD: evidentia-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 evidentia evidentia-local-secret &&
      mc mb --ignore-existing local/evidentia-documents"
    restart: "no"

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    <<: *app
    command:
      - celery
      - -A
      - evidentia.workers.celery_app
      - worker
      - -Q
      - default,documents,knowledge,generation,integrations
      - --concurrency=4
      - --loglevel=INFO
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *app
    command:
      ["celery", "-A", "evidentia.workers.celery_app", "beat", "--loglevel=INFO",
       "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
